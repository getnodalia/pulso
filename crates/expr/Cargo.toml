[package]
name = "pulso-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pulso-time = { workspace = true }
pulso-geom = { workspace = true }
pulso-keyframe = { workspace = true }
serde_json = { workspace = true }
pulso-project = { workspace = true }
pulso-path = { workspace = true }
pulso-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
pulso-color = { workspace = true }
pulso-effects = { workspace = true }
pulso-text = { workspace = true }
