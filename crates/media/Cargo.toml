[package]
name = "pulso-media"
description = "Footage import: probing, stills, image sequences, video and audio via Toma's pure-Rust codecs, memory-budgeted frame cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nodalia-docpath = { workspace = true }
pulso-time = { workspace = true }
pulso-color = { workspace = true }
pulso-project = { workspace = true }
pulso-raster = { workspace = true }
pulso-render = { workspace = true }
pulso-psd = { workspace = true }
pulso-svg = { workspace = true }
pulso-pdf = { workspace = true }
pulso-model = { workspace = true }
toma-codecs = { workspace = true }
toma-media = { workspace = true }
toma-aac = { workspace = true }
toma-isobmff = { workspace = true }
toma-matroska = { workspace = true }
toma-mpegts = { workspace = true }
toma-frame = { workspace = true }
toma-color = { workspace = true }
toma-time = { workspace = true }
exr = { workspace = true }
gif = { workspace = true }
image = { workspace = true, features = ["gif", "webp", "tiff", "bmp", "exr", "tga", "hdr"] }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# (tests render comps that read layers through effects; already a dependency of pulso-render)
pulso-effects = { workspace = true }
