# Pinned After Effects test corpus for `crates/aep` (read by `cargo xtask aep-corpus`).
#
# The corpus is Nodalia's own (getnodalia/nodalia-corpus, folder `aep/`). It holds no After Effects
# project yet: the maintainer adds real ones there, with their provenance, and then lists each
# file below. An empty list is valid; the tests that need a project skip.
#
#   repo      where the corpus lives (override: PULSO_AEP_CORPUS_REPO, e.g. a local clone)
#   commit    the exact commit to fetch (40 hex digits; a branch or tag name is not accepted)
#   <sha256>  <path>   the SHA-256 of every file the tests use, relative to the corpus root
#
# The hashes are kept here, not read from the fetched repository, so a changed corpus
# cannot vouch for itself. To move the pin: change `commit`, then copy the new SHA256SUMS lines.
repo https://github.com/getnodalia/nodalia-corpus.git
commit 0a22db146f77c6b28914e663cd9953a9807d9bbf
