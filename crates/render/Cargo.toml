[package]
name = "pulso-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pulso-time = { workspace = true }
pulso-geom = { workspace = true }
pulso-color = { workspace = true }
pulso-keyframe = { workspace = true }
pulso-project = { workspace = true }
pulso-raster = { workspace = true }
pulso-path = { workspace = true }
pulso-text = { workspace = true }
pulso-effects = { workspace = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
pulso-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
