[package]
name = "pulso-host"
description = "Builds a fully wired Pulso session: media decoding (Toma codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pulso-engine = { workspace = true }
pulso-project = { workspace = true }
log = { workspace = true }
pulso-media = { workspace = true }
pulso-expr = { workspace = true }
pulso-script = { workspace = true }
pulso-export = { workspace = true }
pulso-plugin = { workspace = true }
serde_json = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pulso-plugin = { workspace = true, features = ["wasm"] }
# External effect helpers: separate processes, so their native code can't take the app down.
pulso-helper-host = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
pulso-psd = { workspace = true }
pulso-svg = { workspace = true }
pulso-pdf = { workspace = true }
pulso-raster = { workspace = true }
pulso-time = { workspace = true }
pulso-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
