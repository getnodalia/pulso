[package]
name = "pulso-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via Toma, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via Pulso encoders, PNG/JPEG/TIFF/EXR/Targa sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pulso-time = { workspace = true }
pulso-project = { workspace = true }
pulso-raster = { workspace = true }
pulso-render = { workspace = true }
filmcraft-h264enc = { workspace = true }
filmcraft-prores = { workspace = true }
filmcraft-aac = { workspace = true }
filmcraft-isobmff = { workspace = true }
pulso-opusenc = { workspace = true }
pulso-vp9enc = { workspace = true }
pulso-hevcenc = { workspace = true }
pulso-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr", "tga"] }
exr = { workspace = true }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
pulso-media = { workspace = true }
pulso-effects = { workspace = true }
pulso-color = { workspace = true }
filmcraft-opus = { workspace = true }
filmcraft-vp9 = { workspace = true }
pulso-keyframe = { workspace = true }
