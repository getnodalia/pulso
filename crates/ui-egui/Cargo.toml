[package]
name = "pulso-ui-egui"
description = "The Pulso egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nodalia-theme = { workspace = true, features = ["creator"] }
nodalia-ui = { workspace = true }
nodalia-quit = { workspace = true, features = ["egui"] }
pulso-time = { workspace = true }
pulso-geom = { workspace = true }
pulso-color = { workspace = true }
pulso-keyframe = { workspace = true }
pulso-project = { workspace = true }
pulso-path = { workspace = true }
pulso-text = { workspace = true }
pulso-render = { workspace = true }
pulso-engine = { workspace = true }
pulso-gpu = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
# Half-float viewer frames of 32 bpc projects (F16C is picked at run time).
half = { workspace = true }
bytemuck = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Floating panels open in OS windows of their own on desktop; the web keeps them in the page.
nodalia-ui = { workspace = true, features = ["native-windows"] }
nodalia-update = { workspace = true }
# Waits for the display pass's error scopes (immediately ready on native wgpu).
pollster = { workspace = true }
sys-locale = { workspace = true }

[dev-dependencies]
# Fonts for kittest: the workspace `egui` features are what test roots resolve, but stating them
# here documents the requirement (kittest's own dev-dependencies do not propagate to consumers).
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "1"
pulso-segment = { workspace = true }
pulso-host = { workspace = true }
pulso-media = { workspace = true }
exr = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
