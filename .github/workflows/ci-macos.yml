name: CI (macOS)

# The macOS leg of the gate: `cargo xtask ci` on Apple silicon, through the suite's shared gate
# workflow. The Linux gate (ci.yml) has no real GPU and runs on x86, so GPU tests on Metal and
# results that depend on the platform's math library first ran on a contributor's Mac.
#
# By hand only (workflow_dispatch): the organization's macOS slots are kept for releases, so no
# pull request or push runs it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@5321115b86797dd193181f889f0155c986959231 # foundation main
    with:
      # The fonts commit the inherited gate used by default.
      fonts-repository: getnodalia/foundation
      fonts-ref: ae3de29f5af46e008e511d39cd664cbdf3236a83
      os: '["macos-15"]'
      timeout-minutes: 120
