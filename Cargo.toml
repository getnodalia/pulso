[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/getnodalia/pulso"

[workspace.dependencies]
nodalia-pdf = { git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5", version = "=0.1.0", default-features = false, features = ["read"] }
nodalia-docpath = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5" }
nodalia-quit = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5" }
nodalia-ecproj-format = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "d39185ad063a4aadec2cad783a5d143366ae9010" }
# In-app updates from this app's GitHub releases, with the update windows for egui.
nodalia-update = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "78c44503e877ad748fd21c4e36e65e7bfc3efc81", features = ["egui"] }
nodalia-theme = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "78c44503e877ad748fd21c4e36e65e7bfc3efc81" }
# internal
pulso-time = { path = "crates/time" }
pulso-geom = { path = "crates/geom" }
pulso-color = { path = "crates/color" }
pulso-raster = { path = "crates/raster" }
pulso-path = { path = "crates/path" }
pulso-keyframe = { path = "crates/keyframe" }
pulso-project = { path = "crates/project" }
pulso-text = { path = "crates/text" }
pulso-effects = { path = "crates/effects" }
pulso-track = { path = "crates/track" }
pulso-segment = { path = "crates/segment" }
pulso-sam2 = { path = "crates/sam2" }
pulso-model = { path = "crates/model" }
pulso-render = { path = "crates/render" }
pulso-gpu = { path = "crates/gpu" }
pulso-media = { path = "crates/media" }
pulso-export = { path = "crates/export" }
pulso-expr = { path = "crates/expr" }
pulso-lottie = { path = "crates/lottie" }
pulso-interchange = { path = "crates/interchange" }
pulso-pdf = { path = "crates/pdf" }
pulso-psd = { path = "crates/psd" }
pulso-aep = { path = "crates/aep" }
pulso-vp9enc = { path = "crates/vp9enc" }
pulso-svg = { path = "crates/svg" }
pulso-engine = { path = "crates/engine" }
pulso-host = { path = "crates/host" }
pulso-ui-egui = { path = "crates/ui-egui" }
pulso-automation = { path = "crates/automation" }
pulso-opusenc = { path = "crates/opusenc" }
pulso-script = { path = "crates/script" }
pulso-hevcenc = { path = "crates/hevcenc" }
pulso-av1enc = { path = "crates/av1enc" }
pulso-plugin = { path = "crates/plugin" }
pulso-helper-host = { path = "crates/helper-host" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
same-file = "1.0"
tempfile = "3.27"

# media codecs + containers: Toma's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
toma-codecs = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-media = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-frame = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-color = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-time = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
# encoders + muxer (crates/export)
toma-h264enc = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-prores = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-aac = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-isobmff = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
# container headers read for AAC channel layouts (crates/media)
toma-matroska = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-mpegts = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
# decoder used as the round-trip oracle of pulso-opusenc (crates/export dev-dependency)
toma-opus = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-vp9 = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
# decoders used as the round-trip oracles of pulso-hevcenc / pulso-av1enc (dev-dependencies only)
toma-hevc = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-av1 = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
toma-interchange = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-project = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }
toma-geom = { git = "https://github.com/getnodalia/foundation", rev = "76d536d49eb5aa15ea637764e2294fddbae1f622" }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "1"
half = "2.7"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
# Shared UI and the complete egui family select reviewed immutable commits below.
nodalia-ui = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5", features = ["serde"] }
# `default_fonts` and `monochrome_emoji_fonts` are explicit: the app's `FontDefinitions::default()`
# and its `✔`/`▣` chrome glyphs need both, and kittest's own dev-dependencies do not propagate.
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a Toma checkout next to this repo: uncomment.
# [patch."https://github.com/getnodalia/foundation"]
# toma-codecs = { path = "../toma/crates/codecs" }
# toma-media = { path = "../toma/crates/media" }
# toma-frame = { path = "../toma/crates/frame" }
# toma-color = { path = "../toma/crates/color" }
# toma-time = { path = "../toma/crates/time" }
# toma-h264enc = { path = "../toma/crates/h264enc" }
# toma-prores = { path = "../toma/crates/prores" }
# toma-aac = { path = "../toma/crates/aac" }
# toma-isobmff = { path = "../toma/crates/isobmff" }
# toma-matroska = { path = "../toma/crates/matroska" }
# toma-mpegts = { path = "../toma/crates/mpegts" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Panics and backtraces keep file and line; full debug info only made the many test binaries large.
debug = "line-tables-only"

# Same settings as `dev`, but with full debug info for interactive debugger sessions: local
# variables, parameters and column breakpoints work. Use `--profile dev-full` when debugging;
# everything else stays on the fast default. See CONTRIBUTING.md, "Setup".
[profile.dev-full]
inherits = "dev"
debug = true

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.pulso-raster]
opt-level = 3

[profile.dev.package.pulso-render]
opt-level = 3

[profile.dev.package.pulso-gpu]
opt-level = 3

[profile.dev.package.pulso-effects]
opt-level = 3

[profile.dev.package.pulso-track]
opt-level = 3

[profile.dev.package.pulso-path]
opt-level = 3

[profile.dev.package.pulso-media]
opt-level = 3

[profile.dev.package.pulso-opusenc]
opt-level = 3

[profile.dev.package.pulso-export]
opt-level = 3

[profile.dev.package.pulso-vp9enc]
opt-level = 3

[profile.dev.package.pulso-hevcenc]
opt-level = 3

[profile.dev.package.pulso-av1enc]
opt-level = 3

# Toma codec hot loops (same settings as Toma's own workspace).
[profile.dev.package.toma-h264]
opt-level = 3

[profile.dev.package.toma-h264enc]
opt-level = 3

[profile.dev.package.toma-hevc]
opt-level = 3

[profile.dev.package.toma-vp9]
opt-level = 3

[profile.dev.package.toma-prores]
opt-level = 3

[profile.dev.package.toma-dnx]
opt-level = 3

[profile.dev.package.toma-av1]
opt-level = 3

[profile.dev.package.toma-aac]
opt-level = 3

[profile.dev.package.toma-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
hayro-syntax = { git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/getnodalia/foundation", rev = "7e52986747f361f86799feaaacc5af8281bdcaa5", version = "=0.3.0" }
ecolor = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
# Patch a crate only together with the dependency that needs it: an unused patch makes the Nix
# build, which uses vendored sources, fail (`cargo xtask lock-patches`).
winit = { git = "https://github.com/getnodalia/foundation", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
